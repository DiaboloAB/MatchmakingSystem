[package]
name = "sim"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
tokio = { version = "1.52.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
log = "0.4.29"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
futures = "0.3.32"
serde_json = "1.0.149"
